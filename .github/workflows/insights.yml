name: Statistiques hebdo

# Dimanche matin, avant le passage du Stratège.
on:
  schedule:
    - cron: "23 13 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  insights:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q pillow
      - name: Récupérer les statistiques
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python pipeline/insights.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/insights.json
          git diff --cached --quiet || (git commit -q -m "statistiques" && git push -q)
